<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 12 Organic Chemistry — NCERT Practice</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#172033;--muted:#667085;--accent:#3157c8;--line:#e3e7ef;--good:#137a45;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:#172b58;color:#fff;padding:28px 18px}header .wrap,main{max-width:900px;margin:auto}h1{margin:0 0 6px;font-size:clamp(1.5rem,4vw,2.2rem)}header p{margin:0;color:#dbe4ff}
main{padding:20px 14px 50px}.toolbar,.question,.result{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.toolbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
label{display:block;font-weight:650;font-size:.9rem;margin-bottom:5px}select,button{font:inherit;border-radius:9px;padding:10px 12px;border:1px solid var(--line);background:white;color:var(--ink);width:100%}
button{background:var(--accent);color:white;border:0;font-weight:650;cursor:pointer}button.secondary{background:#e9edfb;color:#203b8b}button:disabled{opacity:.5;cursor:not-allowed}
.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;margin-bottom:8px}.tag{background:#eef2ff;color:#314a9b;padding:3px 8px;border-radius:99px}
.question h2{font-size:1.08rem;margin:4px 0 12px}.options{display:grid;gap:8px}.option{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:10px;cursor:pointer}.option input{margin-top:5px;accent-color:var(--accent)}.option:has(input:checked){border-color:var(--accent);background:#f2f5ff}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.actions button{width:auto;min-width:135px}.feedback{margin-top:12px;padding:10px;border-radius:9px;background:#f3f5f9}.correct{color:var(--good);font-weight:700}.incorrect{color:var(--bad);font-weight:700}
.small{font-size:.88rem;color:var(--muted)}.hidden{display:none}.progress{height:8px;background:#e4e8f0;border-radius:99px;overflow:hidden;margin:10px 0 16px}.progress span{display:block;height:100%;background:var(--accent);width:0}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:18px}
@media(max-width:520px){.actions button{flex:1}}
</style>
</head>
<body>
<header><div class="wrap"><h1>Class 12 Organic Chemistry Practice</h1><p>NCERT-aligned • PYQ-style • MCQ, Assertion–Reason & Multiple-correct</p></div></header>
<main>
<section class="toolbar">
 <div><label for="chapter">Chapter</label><select id="chapter"><option value="all">All chapters</option><option>Haloalkanes and Haloarenes</option><option>Alcohols, Phenols and Ethers</option><option>Aldehydes, Ketones and Carboxylic Acids</option><option>Amines</option></select></div>
 <div><label for="kind">Question type</label><select id="kind"><option value="all">All types</option><option>MCQ</option><option>Assertion–Reason</option><option>Multiple-correct</option></select></div>
 <div><label for="count">Questions in this round</label><select id="count"><option>10</option><option selected>20</option><option>All</option></select></div>
 <div><button id="start">Start / Reset quiz</button></div>
</section>
<div class="small" id="status"></div><div class="progress"><span id="bar"></span></div>
<div id="quiz"></div>
<div class="actions"><button id="prev" class="secondary">Previous</button><button id="check">Check answer</button><button id="next">Next question</button><button id="finish" class="secondary">Finish quiz</button></div>
<section id="result" class="result hidden"></section>
<footer>Practice set written in an NCERT-aligned, PYQ-style format. It is not a reproduction of official past-paper questions.</footer>
</main>
<script>
const Q=[
{c:"Haloalkanes and Haloarenes",t:"MCQ",q:"Which haloalkane is most reactive towards an SN1 reaction?",o:["CH3Cl","CH3CH2Cl","(CH3)2CHCl","(CH3)3CCl"],a:[3],e:"SN1 rate depends on carbocation stability. A tertiary carbocation is the most stable among these."},
{c:"Haloalkanes and Haloarenes",t:"MCQ",q:"Chlorobenzene is less reactive than chloroethane towards nucleophilic substitution mainly because:",o:["C–Cl bond in chlorobenzene has partial double-bond character","chlorine is larger in chlorobenzene","benzene ring is saturated","chlorobenzene is ionic"],a:[0],e:"Resonance gives the aryl C–Cl bond partial double-bond character; the carbon is sp²-hybridised."},
{c:"Haloalkanes and Haloarenes",t:"Assertion–Reason",q:"Assertion (A): tert-Butyl bromide reacts faster than ethyl bromide by an SN1 mechanism. Reason (R): The tert-butyl carbocation is more stable than the ethyl carbocation.",o:["A and R are true, and R correctly explains A","A and R are true, but R does not explain A","A is true, R is false","A is false, R is true"],a:[0],e:"Both statements are true. Greater carbocation stability lowers the activation barrier for the SN1 step."},
{c:"Haloalkanes and Haloarenes",t:"Multiple-correct",q:"Which statements about the SN2 mechanism are correct?",o:["It is a one-step mechanism","It involves backside attack","Its rate depends on both substrate and nucleophile concentrations","A tertiary alkyl halide is generally the fastest substrate"],a:[0,1,2],e:"SN2 is concerted, involves backside attack and has rate = k[RX][Nu⁻]. Steric hindrance makes tertiary substrates slow."},
{c:"Haloalkanes and Haloarenes",t:"MCQ",q:"Wurtz reaction of bromoethane with sodium in dry ether mainly gives:",o:["Ethane","Butane","Propane","Ethene"],a:[1],e:"Two ethyl groups couple to form butane."},
{c:"Haloalkanes and Haloarenes",t:"Assertion–Reason",q:"Assertion (A): p-Dichlorobenzene has a higher melting point than its ortho and meta isomers. Reason (R): The para isomer is more symmetrical and packs more efficiently in the crystal lattice.",o:["A and R are true, and R correctly explains A","A and R are true, but R does not explain A","A is true, R is false","A is false, R is true"],a:[0],e:"Greater symmetry generally allows more efficient crystal packing, raising the melting point."},
{c:"Haloalkanes and Haloarenes",t:"MCQ",q:"Which reagent converts an alkyl chloride into an alkyl iodide by halogen exchange?",o:["Aqueous KOH","NaI in acetone","Alcoholic KOH","H2/Ni"],a:[1],e:"The Finkelstein reaction uses NaI in dry acetone; NaCl/NaBr precipitates and drives the reaction."},
{c:"Haloalkanes and Haloarenes",t:"Multiple-correct",q:"Which compounds can show optical isomerism?",o:["2-Chlorobutane","1-Chlorobutane","2-Bromobutane","2-Chloro-2-methylpropane"],a:[0,2],e:"2-Chlorobutane and 2-bromobutane each have a carbon attached to four different groups."},

{c:"Alcohols, Phenols and Ethers",t:"MCQ",q:"Phenol is more acidic than ethanol because:",o:["phenoxide ion is resonance-stabilised","ethoxide ion is resonance-stabilised","phenol has a higher molar mass","ethanol is aromatic"],a:[0],e:"The negative charge in phenoxide is delocalised over the aromatic ring; ethoxide has no comparable resonance stabilisation."},
{c:"Alcohols, Phenols and Ethers",t:"MCQ",q:"Which reagent is used in the Lucas test?",o:["Conc. HCl and anhydrous ZnCl2","Br2 water","Neutral FeCl3","Tollens’ reagent"],a:[0],e:"Lucas reagent is concentrated HCl with anhydrous ZnCl2."},
{c:"Alcohols, Phenols and Ethers",t:"Assertion–Reason",q:"Assertion (A): Phenol gives a violet colour with neutral FeCl3. Reason (R): Phenol forms a coloured complex with ferric ions.",o:["A and R are true, and R correctly explains A","A and R are true, but R does not explain A","A is true, R is false","A is false, R is true"],a:[0],e:"The violet colour is a characteristic ferric-phenoxide complex test for phenolic –OH."},
{c:"Alcohols, Phenols and Ethers",t:"Multiple-correct",q:"Which statements about alcohols are correct?",o:["Alcohols can form hydrogen bonds","Boiling points are generally higher than corresponding ethers","Tertiary alcohols are oxidised easily to aldehydes","Lower alcohols are miscible with water"],a:[0,1,3],e:"Hydrogen bonding raises boiling points; lower alcohols mix with water. Tertiary alcohols resist oxidation under ordinary conditions."},
{c:"Alcohols, Phenols and Ethers",t:"MCQ",q:"Anisole on heating with excess HI gives:",o:["Iodobenzene and methanol","Phenol and methyl iodide","Benzene and methanol","Phenol and methane"],a:[1],e:"Cleavage occurs at the alkyl–O bond, not the aryl–O bond, giving phenol and CH3I."},
{c:"Alcohols, Phenols and Ethers",t:"Assertion–Reason",q:"Assertion (A): o-Nitrophenol is steam volatile. Reason (R): It shows intramolecular hydrogen bonding.",o:["A and R are true, and R correctly explains A","A and R are true, but R does not explain A","A is true, R is false","A is false, R is true"],a:[0],e:"Intramolecular hydrogen bonding reduces intermolecular association, lowering the boiling point."},
{c:"Alcohols, Phenols and Ethers",t:"MCQ",q:"Dehydration of ethanol with concentrated H2SO4 at about 443 K gives mainly:",o:["Ethene","Ethane","Ethanal","Diethyl ether"],a:[0],e:"At about 443 K, ethanol undergoes intramolecular dehydration to ethene."},
{c:"Alcohols, Phenols and Ethers",t:"Multiple-correct",q:"Which reactions are characteristic of phenol?",o:["Bromination with bromine water gives 2,4,6-tribromophenol","Kolbe reaction gives salicylic acid after acidification","Reimer–Tiemann reaction gives salicylaldehyde","It gives a positive Tollens’ test"],a:[0,1,2],e:"Phenol undergoes bromination, Kolbe–Schmitt carboxylation and Reimer–Tiemann formylation; it does not normally give Tollens’ test."},

{c:"Aldehydes, Ketones and Carboxylic Acids",t:"MCQ",q:"Which compound gives a positive Tollens’ test?",o:["Propanone","Propanal","Benzophenone","Ethanoic acid"],a:[1],e:"Aldehydes reduce Tollens’ reagent to metallic silver; propanal is an aldehyde."},
{c:"Aldehydes, Ketones and Carboxylic Acids",t:"MCQ",q:"The reagent used to distinguish an aldehyde from a ketone is:",o:["Tollens’ reagent","NaCl solution","Dilute HCl","Sodium metal"],a:[0],e:"Aldehydes generally give a silver mirror with Tollens’ reagent; ordinary ketones do not."},
{c:"Aldehydes, Ketones and Carboxylic Acids",t:"Assertion–Reason",q:"Assertion (A): Carboxylic acids have higher boiling points than aldehydes of comparable molar mass. Reason (R): Carboxylic acids form hydrogen-bonded dimers.",o:["A and R are true, and R correctly explains A","A and R are true, but R does not explain A","A is true, R is false","A is false, R is true"],a:[0],e:"Intermolecular hydrogen-bonded dimer formation increases the boiling points of carboxylic acids."},
{c:"Aldehydes, Ketones and Carboxylic Acids",t:"Multiple-correct",q:"Which compounds undergo aldol condensation under suitable conditions?",o:["Ethanal","Propanone","Benzaldehyde","Methanal"],a:[0,1],e:"Aldol condensation requires at least one alpha-hydrogen. Ethanal and propanone have alpha-hydrogens."},
{c:"Aldehydes, Ketones and Carboxylic Acids",t:"MCQ",q:"Clemmensen reduction converts the carbonyl group of aldehydes/ketones into:",o:["–COOH","–CH2–","–OH","–CHO"],a:[1],e:"Zn(Hg)/conc. HCl reduces C=O to a methylene group."},
{c:"Aldehydes, Ketones and Carboxylic Acids",t:"Assertion–Reason",q:"Assertion (A): Formaldehyde undergoes Cannizzaro reaction. Reason (R): Formaldehyde has no alpha-hydrogen.",o:["A and R are true, and R correctly explains A","A and R are true, but R does not explain A","A is true, R is false","A is false, R is true"],a:[0],e:"Aldehydes without alpha-hydrogen undergo Cannizzaro disproportionation in concentrated alkali."},
{c:"Aldehydes, Ketones and Carboxylic Acids",t:"MCQ",q:"Which is the strongest acid?",o:["CH3COOH","ClCH2COOH","CH2ClCH2COOH","C2H5COOH"],a:[1],e:"The –I effect of chlorine stabilises the carboxylate ion; it is strongest when chlorine is closest to –COOH."},
{c:"Aldehydes, Ketones and Carboxylic Acids",t:"Multiple-correct",q:"Which reagents can reduce aldehydes to primary alcohols?",o:["NaBH4","LiAlH4","Tollens’ reagent","H2/Ni"],a:[0,1,3],e:"NaBH4, LiAlH4 and catalytic hydrogenation reduce aldehydes to primary alcohols. Tollens’ reagent is an oxidising reagent."},

{c:"Amines",t:"MCQ",q:"Which is the most basic in aqueous solution among these?",o:["NH3","CH3NH2","(CH3)2NH","(CH3)3N"],a:[2],e:"In water, secondary amines are often most basic because of +I effect and effective solvation; dimethylamine is strongest here."},
{c:"Amines",t:"MCQ",q:"Aniline is less basic than methylamine because:",o:["the lone pair on nitrogen is delocalised into the benzene ring","aniline has no lone pair","methylamine is aromatic","aniline is ionic"],a:[0],e:"Resonance delocalisation makes the nitrogen lone pair less available for protonation."},
{c:"Amines",t:"Assertion–Reason",q:"Assertion (A): Aniline does not undergo Friedel–Crafts alkylation readily. Reason (R): The –NH2 group forms a salt/complex with the Lewis acid catalyst AlCl3.",o:["A and R are true, and R correctly explains A","A and R are true, but R does not explain A","A is true, R is false","A is false, R is true"],a:[0],e:"Aniline coordinates with AlCl3, which deactivates the ring and interferes with Friedel–Crafts reaction."},
{c:"Amines",t:"Multiple-correct",q:"Which statements about diazonium salts are correct?",o:["Benzenediazonium chloride is prepared at 273–278 K","They can be converted into aryl chlorides using CuCl","They are useful intermediates in preparing substituted aromatic compounds","They are generally stable at room temperature in aqueous solution"],a:[0,1,2],e:"Arenediazonium salts are prepared cold and used in substitution reactions; they are not generally stable at room temperature in aqueous solution."},
{c:"Amines",t:"MCQ",q:"Carbylamine test is given by:",o:["Primary amines","Secondary amines","Tertiary amines","Amides"],a:[0],e:"Only primary amines give foul-smelling isocyanides with CHCl3 and alcoholic KOH."},
{c:"Amines",t:"Assertion–Reason",q:"Assertion (A): Aniline reacts with bromine water to form 2,4,6-tribromoaniline. Reason (R): The –NH2 group strongly activates the benzene ring and directs substitution to ortho and para positions.",o:["A and R are true, and R correctly explains A","A and R are true, but R does not explain A","A is true, R is false","A is false, R is true"],a:[0],e:"The strongly activating –NH2 group directs bromination to both ortho positions and the para position."},
{c:"Amines",t:"MCQ",q:"Hinsberg reagent is:",o:["Benzenesulphonyl chloride","Acetyl chloride","Benzoyl peroxide","Sodium nitrite"],a:[0],e:"Benzenesulphonyl chloride is used in the Hinsberg test to distinguish classes of amines."},
{c:"Amines",t:"Multiple-correct",q:"Which methods can be used to prepare primary amines?",o:["Reduction of nitriles","Gabriel phthalimide synthesis","Ammonolysis of alkyl halides (with suitable control)","Hofmann bromamide degradation"],a:[0,1,2,3],e:"All four are recognised routes. Hofmann degradation gives a primary amine with one carbon fewer than the amide."}
];
const $=id=>document.getElementById(id);let round=[],idx=0,answers={},checked={},finished=false;
function filtered(){let c=$('chapter').value,k=$('kind').value;return Q.filter(x=>(c==='all'||x.c===c)&&(k==='all'||x.t===k))}
function start(){let pool=filtered();let n=$('count').value==='All'?pool.length:Number($('count').value);round=pool.slice().sort(()=>Math.random()-.5).slice(0,n);idx=0;answers={};checked={};finished=false;$('result').classList.add('hidden');render()}
function render(){if(!round.length){$('quiz').innerHTML='<div class="question">No questions match these filters.</div>';$('status').textContent='';return}
let q=round[idx],chosen=answers[idx]||[];$('status').textContent=`Question ${idx+1} of ${round.length} • ${Object.keys(checked).length} checked`;
$('bar').style.width=((idx+1)/round.length*100)+'%';
$('quiz').innerHTML=`<article class="question"><div class="meta"><span class="tag">${q.c}</span><span class="tag">${q.t}</span></div><h2>${idx+1}. ${q.q}</h2><div class="small">${q.t==='Multiple-correct'?'Select all correct options.':'Select one option.'}</div><div class="options">${q.o.map((v,i)=>`<label class="option"><input type="${q.t==='Multiple-correct'?'checkbox':'radio'}" name="answer" value="${i}" ${chosen.includes(i)?'checked':''} ${checked[idx]?'disabled':''}><span>${String.fromCharCode(65+i)}. ${v}</span></label>`).join('')}</div>${checked[idx]?feedback(q):''}</article>`;
document.querySelectorAll('input[name=answer]').forEach(el=>el.addEventListener('change',()=>{if(q.t==='Multiple-correct'){let a=[...document.querySelectorAll('input[name=answer]:checked')].map(x=>+x.value);answers[idx]=a}else{answers[idx]=[+el.value]}}));
$('prev').disabled=idx===0;$('next').disabled=idx===round.length-1;$('check').disabled=!!checked[idx];}
function feedback(q){let got=(answers[idx]||[]).slice().sort((a,b)=>a-b),want=q.a.slice().sort((a,b)=>a-b),ok=got.length===want.length&&got.every((v,i)=>v===want[i]);return `<div class="feedback"><div class="${ok?'correct':'incorrect'}">${ok?'Correct!':'Not quite.'}</div><div><b>Answer:</b> ${want.map(i=>String.fromCharCode(65+i)).join(', ')}</div><div>${q.e}</div></div>`}
$('start').onclick=start;$('prev').onclick=()=>{if(idx>0){idx--;render()}};$('next').onclick=()=>{if(idx<round.length-1){idx++;render()}};$('check').onclick=()=>{if(!(answers[idx]||[]).length){alert('Choose an answer first.');return}checked[idx]=true;render()};
$('finish').onclick=()=>{if(!round.length)return;let score=0;round.forEach((q,i)=>{let got=(answers[i]||[]).slice().sort((a,b)=>a-b),want=q.a.slice().sort((a,b)=>a-b);if(got.length===want.length&&got.every((v,j)=>v===want[j]))score++});$('result').classList.remove('hidden');$('result').innerHTML=`<h2>Quiz result</h2><p><b>${score} / ${round.length}</b> correct (${Math.round(score/round.length*100)}%).</p><p>${score===round.length?'Excellent work!':score>=round.length*.7?'Good progress. Review the explanations for missed questions.':'Keep practising. Revisit the NCERT reactions and concepts, then try again.'}</p><button onclick="start()">Try another shuffled set</button>`;$('result').scrollIntoView({behavior:'smooth'})};
start();
</script>
</body></html>
